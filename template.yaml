AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Guesty webhook receiver — Lambda + API Gateway

# ── Parameters (override at deploy time) ──────────────────────────────────────
Parameters:
  GuestyClientId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /guesty/client_id
    Description: SSM parameter holding your Guesty OAuth client ID

  GuestyClientSecret:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /guesty/client_secret
    Description: SSM parameter holding your Guesty OAuth client secret

  GuestyWebhookSecret:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /guesty/webhook_secret
    Description: SSM parameter holding the optional HMAC webhook secret

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Email address to notify when Lambda invocations approach the free tier limit.
      Leave blank to skip email alerts (alarm still fires in CloudWatch).

# ── Globals shared by all functions ───────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.13
    Timeout: 30          # Guesty expects a response quickly; heavy work is async
    MemorySize: 256
    Environment:
      Variables:
        GUESTY_CLIENT_ID: !Ref GuestyClientId
        GUESTY_CLIENT_SECRET: !Ref GuestyClientSecret
        GUESTY_WEBHOOK_SECRET: !Ref GuestyWebhookSecret
        GUESTY_BASE_URL: "https://open-api.guesty.com"
        GUESTY_TOKEN_URL: "https://open-api.guesty.com/oauth2/token"
        TOKEN_SSM_PARAM: "/guesty/token_cache"
        LOG_LEVEL: !Ref LogLevel

# ── Conditions ────────────────────────────────────────────────────────────────
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

# ── Resources ──────────────────────────────────────────────────────────────────
Resources:

  # ── Lambda function ──────────────────────────────────────────────────────────
  GuestyWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: guesty-webhook
      Handler: lambda_handler.lambda_handler
      CodeUri: .                   # SAM zips this directory; see .samignore below
      Description: Handles Guesty guest/reservation webhook events
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: "guesty/*"
        - Statement:
            - Effect: Allow
              Action:
                - ssm:PutParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/guesty/*"
      Events:
        WebhookPost:
          Type: Api
          Properties:
            RestApiId: !Ref GuestyApi
            Path: /webhook
            Method: POST
        HealthGet:
          Type: Api
          Properties:
            RestApiId: !Ref GuestyApi
            Path: /health
            Method: GET

  # ── API Gateway ──────────────────────────────────────────────────────────────
  GuestyApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: guesty-webhook-api
      StageName: prod
      Description: Public HTTPS endpoint for Guesty webhook callbacks

  # ── SNS topic for invocation alarm notifications ─────────────────────────────
  InvocationAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: guesty-webhook-invocation-alarm
      Subscription:
        !If
          - HasAlertEmail
          - - Protocol: email
              Endpoint: !Ref AlertEmail
          - !Ref AWS::NoValue

  # ── CloudWatch alarm — free tier safeguard ────────────────────────────────────
  # Free tier: 1,000,000 requests/month = ~33,333/day.
  # Alarm fires at 25,000/day (~75% of daily budget) to give time to react.
  InvocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: guesty-webhook-invocations-high
      AlarmDescription: >
        Lambda invocations exceeded 25,000 in a 24-hour period.
        Free tier allows ~33,333/day (1M/month). Investigate for runaway traffic.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref GuestyWebhookFunction
      Statistic: Sum
      Period: 86400        # 24 hours
      EvaluationPeriods: 1
      Threshold: 25000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InvocationAlarmTopic
      OKActions:
        - !Ref InvocationAlarmTopic

  # ── SSM token cache parameter (created empty; auth.py writes to it at runtime) ─
  TokenCacheParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /guesty/token_cache
      Type: String
      Value: '{"token": null, "expires_at": 0}'
      Description: Guesty OAuth token cache for Lambda (managed by auth.py)

# ── Outputs ────────────────────────────────────────────────────────────────────
Outputs:
  WebhookUrl:
    Description: >
      Register this URL in Guesty Dashboard → Integrations → Webhooks.
      Subscribe to: guest.updated, guest.created, guest.deleted, reservation.new
    Value: !Sub "https://${GuestyApi}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook"

  HealthUrl:
    Description: Liveness probe endpoint
    Value: !Sub "https://${GuestyApi}.execute-api.${AWS::Region}.amazonaws.com/prod/health"

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt GuestyWebhookFunction.Arn

  InvocationAlarmName:
    Description: CloudWatch alarm — fires when daily invocations exceed 25,000 (free tier safeguard)
    Value: !Ref InvocationAlarm
